[package]
name = "imgdestroy-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11"
image = { version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "tiff", "webp"]}
log = "0.4"
ndarray = "0.17.2"
ndarray-conv = "0.6.1"
ndrustfft = "0.6.2"
